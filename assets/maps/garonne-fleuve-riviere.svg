<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Arial,sans-serif"><title>Fleuve et rivières : exemple de la Garonne</title><desc>Le Tarn et le Lot sont des affluents de la Garonne. Au bec d’Ambès, la Garonne et la Dordogne forment l’estuaire de la Gironde qui débouche dans l’océan Atlantique. Schéma non cartographique.</desc><defs><marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#347487"/></marker></defs><rect width="720" height="440" rx="12" fill="#fffaf0"/><path d="M0 0H155V190H0Z" fill="#d7e7e4"/><text x="20" y="55" font-size="23" fill="#172e39">Océan</text><text x="20" y="83" font-size="23" fill="#172e39">Atlantique</text><path d="M335 172Q240 150 155 116L155 152Q245 187 335 188Z" fill="#b6d4c4" stroke="#557d6c" stroke-width="2"/><text x="175" y="105" font-size="21" fill="#172e39">Estuaire de la Gironde</text><path d="M300 170 170 137" stroke="#347487" stroke-width="3" marker-end="url(#flow)"/><path d="M315 395Q280 320 320 250L335 180" fill="none" stroke="#347487" stroke-width="9"/><path d="M305 300 323 240" stroke="#347487" stroke-width="3" marker-end="url(#flow)"/><text x="330" y="350" font-size="25" font-weight="bold" fill="#172e39">Garonne</text><text x="330" y="380" font-size="18" fill="#53615a">cours principal</text><path d="M560 72 335 180" fill="none" stroke="#347487" stroke-width="6"/><path d="M458 121 390 154" stroke="#347487" stroke-width="3" marker-end="url(#flow)"/><text x="482" y="56" font-size="23" fill="#172e39">Dordogne</text><path d="M545 245 318 266M115 325 300 330" stroke="#347487" stroke-width="4"/><path d="M485 248 420 255M160 326 230 329" stroke="#347487" stroke-width="3" marker-end="url(#flow)"/><text x="545" y="235" font-size="21" fill="#172e39">Lot</text><text x="73" y="310" font-size="21" fill="#172e39">Tarn</text><text x="500" y="287" font-size="18" fill="#53615a">affluents</text><circle cx="335" cy="180" r="7" fill="#bd6629"/><text x="360" y="181" font-size="22" font-weight="bold" fill="#172e39">Bec d’Ambès</text><text x="360" y="207" font-size="17" fill="#53615a">confluence Garonne–Dordogne</text><text x="20" y="426" font-size="15" fill="#53615a">Schéma pédagogique non cartographique · sens d’écoulement indiqué par les flèches</text></svg>